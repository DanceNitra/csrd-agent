standard:
  id: S4
  name: Consumers and End-Users
  category: Social
  effective_date: "2024-01-01"
  description: "Consumers and end-users impacts and practices"

disclosure_requirements:
  S4-1:
    name: Policies related to consumers and end-users
    description: "Policies for consumer protection and rights"
    type: qualitative
    datapoints:
      - id: S4-1_01
        name: consumer_protection_policies
        question: "Does the undertaking have policies for consumer protection?"
        type: boolean
      - id: S4-1_02
        name: product_safety_policy
        question: "Product safety and quality assurance policies"
        type: boolean
      - id: S4-1_03
        name: data_privacy_policy
        question: "Privacy and data protection policy for end-users"
        type: boolean
      - id: S4-1_04
        name: responsible_marketing
        question: "Responsible marketing and advertising policies"
        type: boolean
      - id: S4-1_05
        name: vulnerable_consumer_protection
        question: "Specific protections for vulnerable consumers"
        type: text

  S4-2:
    name: Processes for engaging with consumers and end-users
    description: "Engagement with consumers and end-users"
    type: qualitative
    datapoints:
      - id: S4-2_01
        name: consumer_engagement
        question: "Consumer engagement and feedback mechanisms"
        type: text
      - id: S4-2_02
        name: consumer_complaint_handling
        question: "Consumer complaint handling and resolution process"
        type: text
      - id: S4-2_03
        name: product_information
        question: "Consumer access to product information and labeling"
        type: text
      - id: S4-2_04
        name: accessibility_measures
        question: "Accessibility measures for products/services"
        type: text

  S4-3:
    name: Remediation of negative impacts
    description: "Remediation for consumer impacts"
    type: qualitative
    datapoints:
      - id: S4-3_01
        name: consumer_remediation
        question: "Remediation mechanisms for consumer harms"
        type: boolean
      - id: S4-3_02
        name: product_recall_process
        question: "Product recall and corrective action process"
        type: text
      - id: S4-3_03
        name: consumer_compensation
        question: "Consumer compensation paid for injuries or damages"
        unit: EUR
        type: monetary
      - id: S4-3_04
        name: data_breach_remediation
        question: "Data breach notification and remediation process"
        type: text

  S4-4:
    name: Targets related to consumers and end-users
    description: "Quantitative targets for consumer metrics"
    type: quantitative
    datapoints:
      - id: S4-4_01
        name: customer_satisfaction_targets
        question: "Customer satisfaction score targets"
        type: text
      - id: S4-4_02
        name: complaint_resolution_targets
        question: "Targets for complaint resolution time"
        type: text
      - id: S4-4_03
        name: product_safety_targets
        question: "Zero product safety incidents target?"
        type: boolean
      - id: S4-4_04
        name: target_base_year
        question: "Base year for consumer targets"
        type: year

  S4-5:
    name: Metrics for consumers and end-users
    description: "Quantitative metrics for consumer impacts"
    type: quantitative
    datapoints:
      - id: S4-5_01
        name: product_safety_incidents
        question: "Product safety incidents reported"
        unit: count
        type: integer
      - id: S4-5_02
        name: product_recalls
        question: "Number of product recalls"
        unit: count
        type: integer
      - id: S4-5_03
        name: consumer_complaints_received
        question: "Consumer complaints received"
        unit: count
        type: integer
      - id: S4-5_04
        name: consumer_complaints_restricted
        question: "Complaints related to access/information restrictions"
        unit: count
        type: integer
      - id: S4-5_05
        name: data_breach_incidents
        question: "Data breaches affecting consumers/end-users"
        unit: count
        type: integer
      - id: S4-5_06
        name: customer_satisfaction_score
        question: "Customer satisfaction score (NPS or equivalent)"
        type: float
      - id: S4-5_07
        name: marketing_compliance_incidents
        question: "Responsible marketing compliance incidents"
        unit: count
        type: integer
      - id: S4-5_08
        name: fines_consumer_protection
        question: "Fines for consumer protection violations"
        unit: EUR
        type: monetary

application_requirements:
  scope: "End-users who use/purchase products or services, including downstream value chain"
  consumer_types:
    - Direct buyers
    - End-users of products
    - Digital product users
    - Vulnerable consumers
  impact_types:
    - Product safety
    - Information access
    - Data privacy
    - Marketing practices
    - Accessibility

references:
  - "EU General Product Safety Regulation (GPSR) 2023/988"
  - "EU General Data Protection Regulation (GDPR) 2016/679"
  - "EU Unfair Commercial Practices Directive 2005/29/EC"
  - "EU Consumer Rights Directive 2011/83/EU"
  - "UN Guidelines for Consumer Protection"
  - "EU Digital Services Act (DSA) 2022/2065"