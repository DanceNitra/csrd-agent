# ESRS S1 — Own Workforce
# Largest ESRS standard with 10 disclosure requirements
# Source: EFRAG IG3 Datapoint List, ESRS S1 delegated regulation

standard:
  id: S1
  name: Own Workforce
  category: Social
  effective_date: "2024-01-01"
  description: "Own workforce working conditions, equal treatment, and human rights"

disclosure_requirements:
  S1-1:
    name: Policies related to own workforce
    description: "Policies for own workforce management"
    type: qualitative
    datapoints:
      - id: S1-1_01
        name: human_rights_policy
        question: "Does the undertaking have a human rights policy covering own workforce?"
        type: boolean
      - id: S1-1_02
        name: due_diligence_process
        question: "Human rights due diligence process for own workforce"
        type: boolean
      - id: S1-1_03
        name: policy_scope
        question: "Which ILO principles and UN Guiding Principles are covered?"
        type: text
      - id: S1-1_04
        name: grievance_mechanisms
        question: "Grievance mechanisms available for own workforce"
        type: boolean
      - id: S1-1_05
        name: stakeholder_engagement_workers
        question: "Process for engaging with workers and worker representatives"
        type: text

  S1-2:
    name: Processes for engaging with own workforce
    description: "Engagement processes with workforce and representatives"
    type: qualitative
    datapoints:
      - id: S1-2_01
        name: consultation_processes
        question: "Regular consultation and dialogue with workers"
        type: boolean
      - id: S1-2_02
        name: worker_representation
        question: "Collective bargaining coverage and worker representation bodies"
        type: text
      - id: S1-2_03
        name: engagement_channels
        question: "Channels for workers to raise concerns (whistleblowing, surveys)"
        type: text
      - id: S1-2_04
        name: remediation_process
        question: "Process to provide remedies for identified adverse impacts"
        type: text

  S1-3:
    name: Remediation of negative impacts
    description: "Remediation processes for own workforce impacts"
    type: qualitative
    datapoints:
      - id: S1-3_01
        name: remediation_mechanisms
        question: "Remediation mechanisms for negative human rights impacts"
        type: boolean
      - id: S1-3_02
        name: past_remediation_cases
        question: "Number and nature of past remediation cases"
        type: text
      - id: S1-3_03
        name: effectiveness_tracking
        question: "How effectiveness of remediation is tracked"
        type: text

  S1-4:
    name: Targets related to own workforce
    description: "Quantitative targets for workforce management"
    type: quantitative
    datapoints:
      - id: S1-4_01
        name: diversity_targets
        question: "Targets for gender diversity at management levels"
        type: text
      - id: S1-4_02
        name: injury_reduction_targets
        question: "Targets for reducing workplace injuries and incidents"
        type: text
      - id: S1-4_03
        name: training_targets
        question: "Targets for training hours per employee"
        unit: hours
        type: float
      - id: S1-4_04
        name: wage_gap_targets
        question: "Targets for reducing gender pay gap"
        type: text
      - id: S1-4_05
        name: turnover_targets
        question: "Targets for employee turnover reduction"
        type: text
      - id: S1-4_06
        name: target_base_year
        question: "Base year for workforce targets"
        type: year

  S1-5:
    name: Workforce characteristics
    description: "Workforce composition and characteristics"
    type: quantitative
    datapoints:
      - id: S1-5_01
        name: total_employees
        question: "Total number of employees"
        unit: count
        type: integer
      - id: S1-5_02
        name: employees_by_gender
        question: "Employees by gender (male, female, other)"
        type: text
      - id: S1-5_03
        name: employees_by_region
        question: "Employees by geographic region"
        type: text
      - id: S1-5_04
        name: employees_by_contract
        question: "Employees by contract type (permanent, temporary, part-time)"
        type: text
      - id: S1-5_05
        name: non_employee_workers
        question: "Number of non-employee workers (agency, contractors)"
        unit: count
        type: integer
      - id: S1-5_06
        name: employee_turnover_rate
        question: "Employee turnover rate"
        unit: percentage
        type: float
      - id: S1-5_07
        name: average_seniority
        question: "Average employee seniority"
        unit: years
        type: float
      - id: S1-5_08
        name: age_distribution
        question: "Age distribution of employees"
        type: text

  S1-6:
    name: Working conditions metrics
    description: "Metrics on working conditions"
    type: quantitative
    datapoints:
      - id: S1-6_01
        name: collective_bargaining_coverage
        question: "Share of employees covered by collective bargaining agreements"
        unit: percentage
        type: float
      - id: S1-6_02
        name: social_dialogue
        question: "Quality of social dialogue and worker representation"
        type: text
      - id: S1-6_03
        name: work_life_balance
        question: "Policies for work-life balance (parental leave, flexible work)"
        type: text
      - id: S1-6_04
        name: parental_leave_takers
        question: "Employees who took parental leave and return-to-work rate"
        type: text
      - id: S1-6_05
        name: fair_remuneration
        question: "Fair wage assessment vs living wage benchmarks"
        type: text

  S1-7:
    name: Health and safety metrics
    description: "Health and safety performance metrics"
    type: quantitative
    datapoints:
      - id: S1-7_01
        name: injury_rate
        question: "Rate of recordable workplace injuries per 100,000 hours"
        type: float
      - id: S1-7_02
        name: fatalities
        question: "Number of work-related fatalities"
        unit: count
        type: integer
      - id: S1-7_03
        name: lost_days
        question: "Lost days due to workplace injuries/illness"
        unit: days
        type: integer
      - id: S1-7_04
        name: absentee_rate
        question: "Absentee rate (sick days per employee)"
        unit: days
        type: float
      - id: S1-7_05
        name: hse_training_hours
        question: "Hours of health and safety training per employee"
        unit: hours
        type: float
      - id: S1-7_06
        name: psychosocial_risks
        question: "Psychosocial risk assessment and management programs"
        type: text
      - id: S1-7_07
        name: occupational_illness
        question: "Occupational illness cases"
        unit: count
        type: integer

  S1-8:
    name: Training and skills development metrics
    description: "Training, skills development, career progression metrics"
    type: quantitative
    datapoints:
      - id: S1-8_01
        name: training_hours_total
        question: "Total training hours across all employees"
        unit: hours
        type: float
      - id: S1-8_02
        name: training_hours_per_employee
        question: "Average training hours per employee"
        unit: hours
        type: float
      - id: S1-8_03
        name: training_by_gender
        question: "Training hours by gender category"
        type: text
      - id: S1-8_04
        name: training_programs
        question: "Types of training programs offered (upskilling, reskilling)"
        type: text
      - id: S1-8_05
        name: career_progression
        question: "Career progression and promotion metrics"
        type: text
      - id: S1-8_06
        name: performance_reviews
        question: "Share of employees receiving regular performance/career reviews"
        unit: percentage
        type: float

  S1-9:
    name: Diversity metrics
    description: "Diversity and equal opportunity metrics"
    type: quantitative
    datapoints:
      - id: S1-9_01
        name: gender_diversity_board
        question: "Gender diversity at board level"
        unit: percentage
        type: float
      - id: S1-9_02
        name: gender_diversity_management
        question: "Gender diversity at management level"
        unit: percentage
        type: float
      - id: S1-9_03
        name: gender_pay_gap
        question: "Gender pay gap (mean and median)"
        unit: percentage
        type: float
      - id: S1-9_04
        name: remuneration_ratio
        question: "Ratio of CEO vs median employee remuneration"
        type: float
      - id: S1-9_05
        name: diversity_monitoring
        question: "Diversity monitoring by age, disability, ethnicity"
        type: text

  S1-10:
    name: Human rights metrics
    description: "Human rights performance metrics"
    type: quantitative
    datapoints:
      - id: S1-10_01
        name: discrimination_incidents
        question: "Number of discrimination incidents reported"
        unit: count
        type: integer
      - id: S1-10_02
        name: human_rights_violations
        question: "Number of human rights violations identified"
        unit: count
        type: integer
      - id: S1-10_03
        name: remediation_actions_taken
        question: "Remediation actions taken for human rights impacts"
        type: text
      - id: S1-10_04
        name: whistleblower_reports
        question: "Whistleblower reports related to workforce"
        unit: count
        type: integer
      - id: S1-10_05
        name: forced_labor_indicators
        question: "Assessment of forced labor indicators in own workforce"
        type: text
      - id: S1-10_06
        name: child_labor_indicators
        question: "Assessment of child labor indicators in own workforce"
        type: text

application_requirements:
  scope: "Own employees and non-employee workers"
  workforce_boundary:
    - Direct employees (permanent, temporary, part-time)
    - Agency workers
    - Self-employed contractors under company direction
  disaggregation: "By gender for all metrics where statistically relevant"
  use_estimates: true

references:
  - "UN Guiding Principles on Business and Human Rights"
  - "ILO Declaration on Fundamental Principles and Rights at Work"
  - "EU Directive on Work-Life Balance 2019/1158"
  - "EU Directive on Adequate Minimum Wages 2022/2041"
  - "Corporate Sustainability Reporting Directive (CSRD) 2022/2464"
  - "EU Occupational Safety and Health (OSH) Framework Directive 89/391/EEC"