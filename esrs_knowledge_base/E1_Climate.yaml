# ESRS E1 — Climate Change
# ~130+ datapoints (largest environmental standard)
# Source: EFRAG IG3 Datapoint List, GHG Protocol

standard: "E1"
title: "Climate Change"
category: "environmental"
always_material: false
total_datapoints: 132
requires_alignment: "Paris Agreement 1.5°C, GHG Protocol"

sections:
  - id: "E1-1"
    title: "Transition plan for climate change mitigation"
    mandatory: true  # mandatory regardless of materiality for large companies
    type: "narrative+table"
    description: "Company's transition plan aligned with Paris Agreement 1.5°C goal"
    datapoints:
      - name: "E1-1_01"
        description: "Whether company has a transition plan for climate mitigation"
        type: "boolean"
        mandatory: true
      - name: "E1-1_02"
        description: "GHG emission reduction targets and deadlines"
        type: "table"
      - name: "E1-1_03"
        description: "Decarbonization levers identified"
        type: "narrative"
      - name: "E1-1_04"
        description: "Investment and funding plan for transition"
        type: "narrative"
      - name: "E1-1_05"
        description: "Alignment with EU Taxonomy"
        type: "boolean"

  - id: "E1-2"
    title: "Policies related to climate change mitigation and adaptation"
    type: "narrative"
    datapoints:
      - name: "E1-2_01"
        description: "Climate change mitigation policies"
        type: "narrative"
      - name: "E1-2_02"
        description: "Climate change adaptation policies"
        type: "narrative"
      - name: "E1-2_03"
        description: "Scope of policies (own ops, value chain)"
        type: "narrative"

  - id: "E1-3"
    title: "Actions and resources related to climate change"
    type: "narrative"
    datapoints:
      - name: "E1-3_01"
        description: "Key actions for climate mitigation and adaptation"
        type: "narrative"
      - name: "E1-3_02"
        description: "Resources allocated (CapEx, OpEx) for climate actions"
        type: "numeric"

  - id: "E1-4"
    title: "Targets related to climate change mitigation and adaptation"
    type: "table"
    datapoints:
      - name: "E1-4_01"
        description: "GHG reduction targets (absolute and intensity)"
        type: "table"
      - name: "E1-4_02"
        description: "Base year and target year"
        type: "table"
      - name: "E1-4_03"
        description: "Progress against targets"
        type: "table"
      - name: "E1-4_04"
        description: "Whether targets are science-based (SBTi)"
        type: "boolean"

  - id: "E1-5"
    title: "Energy consumption and mix"
    type: "table"
    mandatory: true  # mandatory regardless of materiality
    datapoints:
      - name: "E1-5_01"
        description: "Total energy consumption (MWh)"
        type: "numeric"
        unit: "MWh"
      - name: "E1-5_02"
        description: "Fossil fuel consumption (MWh)"
        type: "numeric"
        unit: "MWh"
      - name: "E1-5_03"
        description: "Nuclear energy consumption (MWh)"
        type: "numeric"
        unit: "MWh"
      - name: "E1-5_04"
        description: "Renewable energy consumption (MWh)"
        type: "numeric"
        unit: "MWh"
      - name: "E1-5_05"
        description: "Renewable energy share in total consumption (%)"
        type: "numeric"
        unit: "percentage"
      - name: "E1-5_06"
        description: "Energy intensity (MWh per net revenue)"
        type: "numeric"

  - id: "E1-6"
    title: "Gross Scopes 1, 2, 3 and Total GHG emissions"
    type: "table"
    mandatory: true  # mandatory regardless of materiality
    datapoints:
      - name: "E1-6_01"
        description: "Gross Scope 1 GHG emissions (tCO2e)"
        type: "numeric"
        unit: "tCO2e"
      - name: "E1-6_02"
        description: "Gross Scope 2 location-based GHG emissions (tCO2e)"
        type: "numeric"
        unit: "tCO2e"
      - name: "E1-6_03"
        description: "Gross Scope 2 market-based GHG emissions (tCO2e)"
        type: "numeric"
        unit: "tCO2e"
      - name: "E1-6_04"
        description: "Gross Scope 3 GHG emissions — total (tCO2e)"
        type: "numeric"
        unit: "tCO2e"
      - name: "E1-6_05"
        description: "Scope 3 Category 1 — Purchased goods and services"
        type: "numeric"
      - name: "E1-6_06"
        description: "Scope 3 Category 2 — Capital goods"
        type: "numeric"
      - name: "E1-6_07"
        description: "Scope 3 Category 3 — Fuel and energy-related activities"
        type: "numeric"
      - name: "E1-6_08"
        description: "Scope 3 Category 4 — Upstream transportation and distribution"
        type: "numeric"
      - name: "E1-6_09"
        description: "Scope 3 Category 5 — Waste generated in operations"
        type: "numeric"
      - name: "E1-6_10"
        description: "Scope 3 Category 6 — Business travel"
        type: "numeric"
      - name: "E1-6_11"
        description: "Scope 3 Category 7 — Employee commuting"
        type: "numeric"
      - name: "E1-6_12"
        description: "Scope 3 Category 8 — Upstream leased assets"
        type: "numeric"
      - name: "E1-6_13"
        description: "Scope 3 Category 9 — Downstream transportation"
        type: "numeric"
      - name: "E1-6_14"
        description: "Scope 3 Category 10 — Processing of sold products"
        type: "numeric"
      - name: "E1-6_15"
        description: "Scope 3 Category 11 — Use of sold products"
        type: "numeric"
      - name: "E1-6_16"
        description: "Scope 3 Category 12 — End-of-life treatment of sold products"
        type: "numeric"
      - name: "E1-6_17"
        description: "Scope 3 Category 13 — Downstream leased assets"
        type: "numeric"
      - name: "E1-6_18"
        description: "Scope 3 Category 14 — Franchises"
        type: "numeric"
      - name: "E1-6_19"
        description: "Scope 3 Category 15 — Investments"
        type: "numeric"
      - name: "E1-6_20"
        description: "Total GHG emissions (Scope 1 + 2 + 3)"
        type: "numeric"
      - name: "E1-6_21"
        description: "GHG intensity (tCO2e per net revenue)"
        type: "numeric"

  - id: "E1-7"
    title: "GHG removals and GHG mitigation projects financed through carbon credits"
    type: "table"
    datapoints:
      - name: "E1-7_01"
        description: "GHG removals (tCO2e) from own operations"
        type: "numeric"
      - name: "E1-7_02"
        description: "Carbon credits purchased and retired (tCO2e)"
        type: "numeric"
      - name: "E1-7_03"
        description: "Carbon credit certification standards used"
        type: "narrative"

  - id: "E1-8"
    title: "Internal carbon pricing"
    type: "narrative"
    datapoints:
      - name: "E1-8_01"
        description: "Whether internal carbon pricing is applied"
        type: "boolean"
      - name: "E1-8_02"
        description: "Type of internal carbon pricing (shadow price, internal tax, internal fund)"
        type: "narrative"
      - name: "E1-8_03"
        description: "Price applied (€/tCO2e)"
        type: "numeric"

  - id: "E1-9"
    title: "Anticipated financial effects from material physical and transition risks"
    type: "table"
    datapoints:
      - name: "E1-9_01"
        description: "Financial effects from physical climate risks"
        type: "numeric"
      - name: "E1-9_02"
        description: "Financial effects from transition risks"
        type: "numeric"
      - name: "E1-9_03"
        description: "Climate-related opportunities"
        type: "narrative"