# ESRS E4 — Biodiversity and Ecosystems
# ~50+ datapoints covering biodiversity, ecosystem services, land use, and deforestation
# Source: EFRAG IG3 Datapoint List, TNFD Framework, EU Biodiversity Strategy 2030

standard:
  id: E4
  name: Biodiversity and Ecosystems
  category: Environmental
  effective_date: "2024-01-01"
  description: "Biodiversity and ecosystem protection and restoration"

disclosure_requirements:
  E4-1:
    name: Transition plan and consideration of biodiversity
    description: "Transition plan for biodiversity and ecosystem protection"
    type: qualitative
    datapoints:
      - id: E4-1_01
        name: biodiversity_transition_plan
        question: "Does the undertaking have a biodiversity transition plan?"
        type: boolean
      - id: E4-1_02
        name: biodiversity_integrated_strategy
        question: "Is biodiversity integrated into corporate strategy?"
        type: boolean
      - id: E4-1_03
        name: deforestation_commitment
        question: "Commitment to zero deforestation by 2025/2030"
        type: boolean
      - id: E4-1_04
        name: biodiversity_governance
        question: "Governance body responsible for biodiversity"
        type: text
      - id: E4-1_05
        name: materiality_biodiversity
        question: "Biodiversity materiality assessment outcomes"
        type: text

  E4-2:
    name: Policies related to biodiversity and ecosystems
    description: "Policies for biodiversity and ecosystem management"
    type: qualitative
    datapoints:
      - id: E4-2_01
        name: biodiversity_policies
        question: "Policies to avoid, minimize, restore biodiversity impacts"
        type: boolean
      - id: E4-2_02
        name: ecosystem_services_recognition
        question: "Do policies recognize dependencies on ecosystem services?"
        type: boolean
      - id: E4-2_03
        name: mitigation_hierarchy
        question: "Use of mitigation hierarchy (avoid, minimize, restore, offset)"
        type: boolean
      - id: E4-2_04
        name: policy_alignment
        question: "Alignment with EU Biodiversity Strategy 2030 and TNFD"
        type: text
      - id: E4-2_05
        name: protected_areas_policy
        question: "Policy on operations in or near biodiversity-sensitive areas"
        type: text

  E4-3:
    name: Actions and resources related to biodiversity and ecosystems
    description: "Actions and resources for biodiversity protection"
    type: qualitative
    datapoints:
      - id: E4-3_01
        name: biodiversity_action_plans
        question: "Specific action plans for biodiversity protection"
        type: text
      - id: E4-3_02
        name: restoration_programs
        question: "Ecosystem restoration and rewilding programs"
        type: text
      - id: E4-3_03
        name: biodiversity_capex
        question: "CAPEX/OPEX allocated to biodiversity initiatives"
        type: monetary
      - id: E4-3_04
        name: supplier_biodiversity_requirements
        question: "Supply chain biodiversity requirements and assessments"
        type: text
      - id: E4-3_05
        name: partnerships_conservation
        question: "Partnerships with conservation organizations"
        type: text

  E4-4:
    name: Targets related to biodiversity and ecosystems
    description: "Quantitative targets for biodiversity and ecosystems"
    type: quantitative
    datapoints:
      - id: E4-4_01
        name: biodiversity_restoration_targets
        question: "Area of habitat to be restored/rehabilitated (ha)"
        unit: ha
        type: float
      - id: E4-4_02
        name: deforestation_reduction
        question: "Targets for deforestation reduction in supply chain"
        type: text
      - id: E4-4_03
        name: sites_biodiversity_sensitive
        question: "Number of sites in or near biodiversity-sensitive areas"
        unit: count
        type: integer
      - id: E4-4_04
        name: species_protection_targets
        question: "Targets for species protection and impact minimization"
        type: text
      - id: E4-4_05
        name: target_base_year
        question: "Base year for biodiversity targets"
        type: year
      - id: E4-4_06
        name: land_use_targets
        question: "Targets for sustainable land use/land-use change"
        type: text

  E4-5:
    name: Impact metrics related to biodiversity and ecosystems
    description: "Metrics for biodiversity and ecosystem impacts"
    type: quantitative
    datapoints:
      - id: E4-5_01
        name: land_use_total
        question: "Total land use by type (sealed, natural, managed)"
        unit: ha
        type: float
      - id: E4-5_02
        name: land_use_near_protected
        question: "Land use in or near biodiversity-sensitive areas"
        unit: ha
        type: float
      - id: E4-5_03
        name: land_use_converted
        question: "Land converted from natural habitat"
        unit: ha
        type: float
      - id: E4-5_04
        name: invasive_species_introduced
        question: "Invasive species introduced by operations"
        type: text
      - id: E4-5_05
        name: species_impact_assessment
        question: "Species at risk from operations (IUCN Red List)"
        type: text
      - id: E4-5_06
        name: msa_metric
        question: "Mean Species Abundance (MSA) metric if available"
        type: float
      - id: E4-5_07
        name: ecosystem_services_dependency
        question: "Ecosystem services dependencies identified (LEAP approach)"
        type: text

  E4-6:
    name: Financial effects of biodiversity-related impacts
    description: "Financial effects from biodiversity and ecosystem impacts"
    type: monetary
    datapoints:
      - id: E4-6_01
        name: biodiversity_fines
        question: "Fines and penalties related to biodiversity damage"
        unit: EUR
        type: monetary
      - id: E4-6_02
        name: restoration_provisions
        question: "Provisions for habitat restoration and compensation"
        unit: EUR
        type: monetary
      - id: E4-6_03
        name: biodiversity_offset_costs
        question: "Costs of biodiversity offsets or compensatory measures"
        unit: EUR
        type: monetary
      - id: E4-6_04
        name: ecosystem_service_valuation
        question: "Valuation of ecosystem service dependencies at risk"
        unit: EUR
        type: monetary

application_requirements:
  scope: "Own operations, upstream and downstream value chain"
  value_chain_boundary:
    upstream:
      - Raw material sourcing (especially land-intensive)
      - Deforestation-linked commodities
    downstream:
      - Product end-of-life habitat impact
  methodology: "TNFD LEAP approach recommended"
  use_estimates: true

references:
  - "EU Biodiversity Strategy 2030"
  - "TNFD Framework v1.0"
  - "IUCN Red List of Threatened Species"
  - "EU Deforestation Regulation 2023/1115"
  - "Mitigation hierarchy (BBOP standard)"
  - "EU Taxonomy DNSH for biodiversity"