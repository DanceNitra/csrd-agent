# ESRS G1 — Business Conduct
# Governance topical standard
# Source: EFRAG IG3 Datapoint List, ESRS G1 Delegated Act

standard: "G1"
title: "Business Conduct"
category: "governance"
always_material: true
total_datapoints: 30
requires_alignment: "OECD Anti-Bribery Convention, UNCAC, EU Whistleblower Directive"

sections:
  - id: "G1-1"
    title: "Business conduct policies and corporate culture"
    mandatory: true
    type: "narrative+table"
    description: "Policies for business ethics, anti-corruption, anti-bribery, corporate culture, and whistleblower protection"
    datapoints:
      - name: "G1-1_01"
        description: "Whether the undertaking has a code of conduct"
        type: "boolean"
        mandatory: true
      - name: "G1-1_02"
        description: "Anti-corruption and anti-bribery policy"
        type: "boolean"
        mandatory: true
      - name: "G1-1_03"
        description: "Whistleblower protection policy and reporting channel"
        type: "boolean"
        mandatory: true
      - name: "G1-1_04"
        description: "How corporate culture is embedded in governance structures"
        type: "narrative"
      - name: "G1-1_05"
        description: "Ethics and compliance training programs"
        type: "narrative"
      - name: "G1-1_06"
        description: "Which functions and geographies are covered by conduct policies"
        type: "narrative"
      - name: "G1-1_07"
        description: "Conflict of interest management process"
        type: "narrative"
      - name: "G1-1_08"
        description: "Anti-corruption due diligence on third parties (business partners, intermediaries)"
        type: "boolean"

  - id: "G1-2"
    title: "Supplier payment practices"
    type: "narrative+table"
    description: "Supplier payment practices, standard payment terms, and late payment performance"
    datapoints:
      - name: "G1-2_01"
        description: "Standard payment terms offered to suppliers"
        type: "narrative"
      - name: "G1-2_02"
        description: "Average time to pay supplier invoices"
        type: "numeric"
        unit: "days"
      - name: "G1-2_03"
        description: "Percentage of invoices paid beyond standard terms"
        type: "numeric"
        unit: "percentage"
      - name: "G1-2_04"
        description: "Late payment penalties accrued"
        type: "numeric"
        unit: "EUR"
      - name: "G1-2_05"
        description: "Number of legal proceedings related to late payment"
        type: "numeric"
        unit: "count"
      - name: "G1-2_06"
        description: "Description of payment practices with SME suppliers"
        type: "narrative"

  - id: "G1-3"
    title: "Anti-corruption and anti-bribery metrics"
    type: "table"
    description: "Quantitative metrics on corruption and bribery prevention, incidents, and training"
    mandatory: true
    datapoints:
      - name: "G1-3_01"
        description: "Number of corruption or bribery convictions"
        type: "numeric"
        unit: "count"
      - name: "G1-3_02"
        description: "Total fines paid for corruption or bribery violations"
        type: "numeric"
        unit: "EUR"
      - name: "G1-3_03"
        description: "Share of at-risk functions trained on anti-corruption"
        type: "numeric"
        unit: "percentage"
      - name: "G1-3_04"
        description: "Board and management ethics training completion rate"
        type: "numeric"
        unit: "percentage"
      - name: "G1-3_05"
        description: "Number of third parties screened for corruption risk"
        type: "numeric"
        unit: "count"
      - name: "G1-3_06"
        description: "Number of corruption incidents reported through internal reporting channels"
        type: "numeric"
        unit: "count"

  - id: "G1-4"
    title: "Political engagement and lobbying activities"
    type: "narrative+table"
    description: "Lobbying policies, political contributions, and influence activities"
    datapoints:
      - name: "G1-4_01"
        description: "Whether the undertaking has a lobbying policy"
        type: "boolean"
      - name: "G1-4_02"
        description: "Political contributions made (direct and indirect)"
        type: "numeric"
        unit: "EUR"
      - name: "G1-4_03"
        description: "EU Transparency Register registration (if applicable)"
        type: "narrative"
      - name: "G1-4_04"
        description: "Total lobbying expenditure"
        type: "numeric"
        unit: "EUR"
      - name: "G1-4_05"
        description: "Alignment of lobbying activities with climate and sustainability goals"
        type: "narrative"
      - name: "G1-4_06"
        description: "Memberships in associations that engage in lobbying activities"
        type: "narrative"

  - id: "G1-5"
    title: "Financial effects from business conduct impacts and risks"
    type: "table"
    description: "Financial effects related to business conduct violations, compliance costs, and litigation"
    datapoints:
      - name: "G1-5_01"
        description: "Total fines from business conduct violations"
        type: "numeric"
        unit: "EUR"
      - name: "G1-5_02"
        description: "Legal costs for business conduct litigation"
        type: "numeric"
        unit: "EUR"
      - name: "G1-5_03"
        description: "Annual cost of compliance and ethics programs"
        type: "numeric"
        unit: "EUR"
      - name: "G1-5_04"
        description: "Costs of whistleblower operation and case handling"
        type: "numeric"
        unit: "EUR"