standard:
  id: E3
  name: Water and Marine Resources
  category: Environmental
  effective_date: "2024-01-01"
  description: "Water consumption, withdrawals, discharges and marine resources"

disclosure_requirements:
  E3-1:
    name: Policies related to water and marine resources
    description: "Policies to manage water and marine resources"
    type: qualitative
    datapoints:
      - id: E3-1_01
        name: water_policies_existence
        question: "Does the undertaking have policies for water management?"
        type: boolean
      - id: E3-1_02
        name: water_management_scope
        question: "Do policies cover water consumption, withdrawals, discharges, and marine resources?"
        type: boolean
      - id: E3-1_03
        name: water_stress_consideration
        question: "Do policies consider water stress in areas of operation?"
        type: boolean
      - id: E3-1_04
        name: policy_alignment_framework
        question: "Alignment with EU Water Framework Directive and MSFD"
        type: text
      - id: E3-1_05
        name: policy_geographic_scope
        question: "Describe geographic scope of water policies"
        type: text

  E3-2:
    name: Actions and resources related to water and marine resources
    description: "Actions and resources for water management"
    type: qualitative
    datapoints:
      - id: E3-2_01
        name: water_action_plans
        question: "Action plans for water consumption reduction and efficiency"
        type: text
      - id: E3-2_02
        name: water_treatment_investments
        question: "Investments in water treatment and recycling infrastructure"
        type: monetary
      - id: E3-2_03
        name: water_management_capex
        question: "CAPEX/OPEX allocated to water management"
        type: monetary
      - id: E3-2_04
        name: partnerships_stewardship
        question: "Partnerships for water stewardship (e.g. AWS certification)"
        type: text
      - id: E3-2_05
        name: marine_protection_initiatives
        question: "Initiatives to protect marine resources and ecosystems"
        type: text

  E3-3:
    name: Targets related to water and marine resources
    description: "Quantitative targets for water management"
    type: quantitative
    datapoints:
      - id: E3-3_01
        name: water_reduction_targets
        question: "Targets for water consumption reduction"
        unit: m3
        type: float
      - id: E3-3_02
        name: water_intensity_targets
        question: "Targets for water intensity per unit of revenue or production"
        type: text
      - id: E3-3_03
        name: water_stress_areas_targets
        question: "Specific targets for operations in water-stressed areas"
        type: text
      - id: E3-3_04
        name: discharge_quality_targets
        question: "Targets for water discharge quality improvements"
        type: text
      - id: E3-3_05
        name: marine_impact_targets
        question: "Targets to minimize impact on marine ecosystems"
        type: text
      - id: E3-3_06
        name: target_base_year
        question: "Base year for water targets"
        type: year

  E3-4:
    name: Water consumption metrics
    description: "Metrics for water consumption, withdrawals, and discharges"
    type: quantitative
    datapoints:
      - id: E3-4_01
        name: total_water_withdrawal
        question: "Total water withdrawn from all areas"
        unit: m3
        type: float
      - id: E3-4_02
        name: water_withdrawal_stress_areas
        question: "Water withdrawn in water-stressed areas"
        unit: m3
        type: float
      - id: E3-4_03
        name: total_water_consumption
        question: "Total water consumption (withdrawn minus discharged)"
        unit: m3
        type: float
      - id: E3-4_04
        name: water_consumption_stress_areas
        question: "Water consumption in water-stressed areas"
        unit: m3
        type: float
      - id: E3-4_05
        name: total_water_discharge
        question: "Total water discharged by destination (surface water, groundwater, third-party)"
        unit: m3
        type: float
      - id: E3-4_06
        name: water_recycled_reused
        question: "Water recycled and reused"
        unit: m3
        type: float
      - id: E3-4_07
        name: water_intensity_revenue
        question: "Water intensity per revenue"
        unit: m3/EUR
        type: float
      - id: E3-4_08
        name: marine_resource_extraction
        question: "Marine resource extraction impact (if applicable)"
        type: text

  E3-5:
    name: Financial effects of water-related impacts
    description: "Financial effects from water and marine resources impacts"
    type: monetary
    datapoints:
      - id: E3-5_01
        name: water_related_fines
        question: "Fines and penalties related to water discharge violations"
        unit: EUR
        type: monetary
      - id: E3-5_02
        name: water_treatment_costs
        question: "Costs for water treatment and management"
        unit: EUR
        type: monetary
      - id: E3-5_03
        name: water_permits_fees
        question: "Water abstraction permits and fees"
        unit: EUR
        type: monetary
      - id: E3-5_04
        name: water_dependency_risk
        question: "Financial risk from water scarcity in operations"
        type: text

application_requirements:
  scope: "Own operations + value chain for water-stressed areas"
  value_chain_boundary:
    upstream:
      - Supplier water consumption
      - Raw material water footprint
    downstream:
      - Product use phase water consumption
  water_stressed_areas: "Use WRI Aqueduct or equivalent tool"
  use_estimates: true

references:
  - "EU Water Framework Directive 2000/60/EC"
  - "Marine Strategy Framework Directive 2008/56/EC"
  - "AWS International Water Stewardship Standard"
  - "WRI Aqueduct Water Risk Atlas"
  - "EU Taxonomy DNSH for water"