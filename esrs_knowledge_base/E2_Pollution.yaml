standard:
  id: E2
  name: Pollution
  category: Environmental
  effective_date: "2024-01-01"
  description: "Pollution of air, water and soil"

disclosure_requirements:
  E2-1:
    name: Policies related to pollution
    description: "Policies to manage pollution prevention and control"
    type: qualitative
    datapoints:
      - id: E2-1_01
        name: pollution_policies_existence
        question: "Does the undertaking have policies to prevent and control pollution?"
        type: boolean
      - id: E2-1_02
        name: pollution_scope_coverage
        question: "Do policies cover air, water, soil pollution, hazardous substances, and SVHC?"
        type: boolean
      - id: E2-1_03
        name: policy_references
        question: "Reference applicable EU directives and regulations (IED, NEC, REACH, CLP)"
        type: text
      - id: E2-1_04
        name: alignment_eu_taxonomy
        question: "Do policies align with EU Taxonomy DNSH criteria for pollution?"
        type: boolean
      - id: E2-1_05
        name: policy_geographic_scope
        question: "Describe geographic scope of pollution policies"
        type: text

  E2-2:
    name: Actions and resources related to pollution
    description: "Actions and resources for pollution prevention and control"
    type: qualitative
    datapoints:
      - id: E2-2_01
        name: action_plans_exist
        question: "Are there action plans to reduce pollution emissions?"
        type: boolean
      - id: E2-2_02
        name: actions_by_pollutant
        question: "List actions per pollutant type (air, water, soil, hazardous)"
        type: text
      - id: E2-2_03
        name: capex_opex_allocated
        question: "CAPEX/OPEX allocated to pollution prevention and control"
        type: monetary
      - id: E2-2_04
        name: investment_roadmap
        question: "Investment roadmap for pollution abatement technologies"
        type: text
      - id: E2-2_05
        name: partnership_remediation
        question: "Partnerships or remediation programs in place"
        type: text

  E2-3:
    name: Targets related to pollution
    description: "Quantitative targets for pollution reduction"
    type: quantitative
    datapoints:
      - id: E2-3_01
        name: emission_reduction_targets
        question: "Quantitative targets for air pollutant reductions (NOx, SOx, PM, VOCs)"
        type: text
      - id: E2-3_02
        name: water_quality_targets
        question: "Targets for water pollution reduction (heavy metals, nutrients)"
        type: text
      - id: E2-3_03
        name: soil_remediation_targets
        question: "Targets for soil remediation and prevention"
        type: text
      - id: E2-3_04
        name: hazardous_substance_reduction
        question: "Targets for reducing hazardous substance use and generation"
        type: text
      - id: E2-3_05
        name: target_base_year
        question: "Base year for pollution targets"
        type: year
      - id: E2-3_06
        name: target_progress
        question: "Progress against pollution targets year-over-year"
        type: percentage

  E2-4:
    name: Pollution metrics
    description: "Metrics for pollution measurement"
    type: quantitative
    datapoints:
      - id: E2-4_01
        name: air_emissions_pollutants
        question: "Air emissions of NOx, SOx, PM2.5, PM10, VOCs, heavy metals"
        unit: tonnes
        type: float
      - id: E2-4_02
        name: water_pollution_discharges
        question: "Water pollution discharges by pollutant type"
        unit: tonnes
        type: float
      - id: E2-4_03
        name: soil_pollution_sites
        question: "Number of contaminated sites and remediation status"
        unit: count
        type: integer
      - id: E2-4_04
        name: hazardous_waste_generated
        question: "Hazardous waste generated (total tonnes)"
        unit: tonnes
        type: float
      - id: E2-4_05
        name: hazardous_waste_recycled
        question: "Hazardous waste recycled or recovered"
        unit: tonnes
        type: float
      - id: E2-4_06
        name: svhc_substances
        question: "Substances of Very High Concern in production processes"
        type: text
      - id: E2-4_07
        name: microplastics_released
        question: "Estimated microplastics released to environment"
        type: text
      - id: E2-4_08
        name: pollutant_intensity
        question: "Pollution intensity per unit of revenue"
        unit: tonnes/revenue
        type: float

  E2-5:
    name: Financial effects of pollution impacts
    description: "Financial effects from pollution-related impacts and dependencies"
    type: monetary
    datapoints:
      - id: E2-5_01
        name: pollution_fines
        question: "Fines and penalties related to pollution incidents"
        unit: EUR
        type: monetary
      - id: E2-5_02
        name: remediation_provisions
        question: "Provisions for site remediation and clean-up costs"
        unit: EUR
        type: monetary
      - id: E2-5_03
        name: carbon_allowance_purchase
        question: "Costs of purchasing pollution/emission allowances"
        unit: EUR
        type: monetary
      - id: E2-5_04
        name: legal_costs_pollution
        question: "Legal costs from pollution-related litigation or claims"
        unit: EUR
        type: monetary

application_requirements:
  scope: "Whole value chain (own operations + upstream/downstream)"
  value_chain_boundary:
    upstream:
      - Raw material extraction
      - Supplier production processes
    downstream:
      - Product use phase (emissions)
      - End-of-life treatment
  use_estimates: true
  estimation_methods:
    - Pollutant-specific emission factors
    - Mass balance
    - Direct measurement preferred

references:
  - "Industrial Emissions Directive (IED) 2010/75/EU"
  - "National Emission Ceilings Directive (NEC) 2016/2284"
  - "REACH Regulation (EC) 1907/2006"
  - "CLP Regulation (EC) 1272/2008"
  - "EU Taxonomy Regulation DNSH criteria"