standard:
  id: S2
  name: Workers in the Value Chain
  category: Social
  effective_date: "2024-01-01"
  description: "ESRS S2 covers the undertaking's impacts on value chain workers, including upstream and downstream workers who are not directly employed by the undertaking but whose working conditions and human rights may be affected by its operations, products, or business relationships."

disclosure_requirements:
  S2-1:
    name: Policies related to value chain workers
    description: "Policies adopted by the undertaking to manage its material impacts on value chain workers, including policies on human rights, forced labor, child labor, and working conditions across the value chain."
    type: qualitative
    datapoints:
      - id: S2-1_01
        name: value_chain_labor_policies
        question: "Does the undertaking have policies covering workers in the value chain?"
        type: boolean
      - id: S2-1_02
        name: supplier_code_conduct
        question: "Does the undertaking have a Supplier Code of Conduct covering labor rights, human rights, and working conditions?"
        type: boolean
      - id: S2-1_03
        name: forced_labor_policy
        question: "Does the undertaking have specific policies prohibiting forced labor, compulsory labor, and human trafficking in the value chain?"
        type: boolean
      - id: S2-1_04
        name: child_labor_policy
        question: "Does the undertaking have specific policies prohibiting child labor in the value chain?"
        type: boolean
      - id: S2-1_05
        name: policy_scope_value_chain
        question: "Describe the scope of the policies by value chain segment (upstream tier 1, tier 2+, downstream) and the categories of value chain workers covered."
        type: text
      - id: S2-1_06
        name: freedom_of_association_policy
        question: "Does the undertaking have policies supporting freedom of association and collective bargaining for value chain workers?"
        type: boolean
      - id: S2-1_07
        name: non_discrimination_policy_vc
        question: "Does the undertaking have policies prohibiting discrimination against value chain workers?"
        type: boolean
      - id: S2-1_08
        name: osh_policy_vc
        question: "Does the undertaking have policies requiring occupational health and safety standards across the value chain?"
        type: boolean
      - id: S2-1_09
        name: international_standards_alignment
        question: "Which international standards are referenced in the policies (e.g., ILO conventions, UN Guiding Principles, OECD Guidelines)?"
        type: text
      - id: S2-1_10
        name: board_oversight_vc_policies
        question: "Describe the governance body responsible for oversight of value chain worker policies."
        type: text

  S2-2:
    name: Processes for engaging with value chain workers about impacts
    description: "The undertaking's general processes for engaging with value chain workers and their representatives about actual and potential impacts on them."
    type: qualitative
    datapoints:
      - id: S2-2_01
        name: engagement_suppliers
        question: "How does the undertaking engage with suppliers on worker rights and working conditions? Describe the frequency, format, and scope of engagement."
        type: text
      - id: S2-2_02
        name: worker_voice_mechanisms
        question: "What mechanisms are in place for value chain workers to raise concerns, grievances, or provide feedback directly to the undertaking?"
        type: text
      - id: S2-2_03
        name: supplier_audits
        question: "Describe the supplier audits and assessments methodology, frequency, and scope for labor and human rights compliance."
        type: text
      - id: S2-2_04
        name: capacity_building
        question: "Describe capacity building programs, training, and awareness initiatives provided to suppliers on labor standards and human rights."
        type: text
      - id: S2-2_05
        name: stakeholder_engagement_vc
        question: "Describe engagement with other relevant stakeholders (NGOs, trade unions, industry initiatives) on value chain worker issues."
        type: text
      - id: S2-2_06
        name: due_diligence_process
        question: "Describe the human rights due diligence process specifically for value chain worker impacts."
        type: text
      - id: S2-2_07
        name: engagement_confidentiality
        question: "How does the undertaking ensure the confidentiality and safety of value chain workers when engaging with them?"
        type: text

  S2-3:
    name: Processes to remediate negative impacts and channels for value chain workers to raise concerns
    description: "Processes for providing remediation of negative impacts on value chain workers and channels available for them to raise concerns."
    type: qualitative
    datapoints:
      - id: S2-3_01
        name: remediation_vc_workers
        question: "Does the undertaking have remediation mechanisms specifically for negative impacts on value chain workers?"
        type: boolean
      - id: S2-3_02
        name: supplier_remediation
        question: "Describe remediation cases related to value chain workers and the follow-up process, including corrective action plans."
        type: text
      - id: S2-3_03
        name: supply_chain_termination
        question: "Number of supply chain relationships terminated due to labor rights violations."
        unit: count
        type: integer
      - id: S2-3_04
        name: grievance_mechanism_vc
        question: "Does the undertaking operate a grievance mechanism accessible to value chain workers?"
        type: boolean
      - id: S2-3_05
        name: grievance_cases
        question: "Number of grievances filed by value chain workers in the reporting period."
        unit: count
        type: integer
      - id: S2-3_06
        name: grievance_resolved
        question: "Number and percentage of grievances resolved in the reporting period."
        unit: percentage
        type: float
      - id: S2-3_07
        name: remediation_effectiveness
        question: "Describe how the undertaking assesses the effectiveness of its remediation processes for value chain workers."
        type: text
      - id: S2-3_08
        name: whistleblower_protection_vc
        question: "Does the undertaking have whistleblower protection mechanisms accessible to value chain workers?"
        type: boolean

  S2-4:
    name: Taking action on material impacts on value chain workers
    description: "Actions taken by the undertaking to prevent, mitigate, and remediate material negative impacts on value chain workers, and to achieve positive outcomes."
    type: qualitative
    datapoints:
      - id: S2-4_01
        name: supply_chain_audit_targets
        question: "Targets for supply chain audit coverage (percentage of suppliers or spend audited annually)."
        unit: percentage
        type: float
      - id: S2-4_02
        name: supplier_compliance_targets
        question: "Targets for supplier compliance with the Code of Conduct."
        unit: percentage
        type: float
      - id: S2-4_03
        name: forced_labor_remediation_targets
        question: "Describe targets for addressing forced labor risks and remediation in the supply chain."
        type: text
      - id: S2-4_04
        name: target_base_year
        question: "Base year for value chain labor targets."
        type: year
      - id: S2-4_05
        name: target_end_year
        question: "Target end year for achieving value chain labor targets."
        type: year
      - id: S2-4_06
        name: ethical_recruitment_targets
        question: "Describe targets for ethical recruitment practices in the value chain, including elimination of recruitment fees."
        type: text
      - id: S2-4_07
        name: living_wage_targets_vc
        question: "Describe targets related to living wage practices in the value chain."
        type: text
      - id: S2-4_08
        name: supplier_training_targets
        question: "Targets for supplier participation in capacity building and training programs."
        unit: percentage
        type: float
      - id: S2-4_09
        name: high_risk_supplier_targets
        question: "Targets for addressing labor risks in high-risk supply chains (e.g., specific commodities or geographies)."
        type: text
      - id: S2-4_10
        name: target_achievement_status
        question: "Describe the current status of progress against value chain worker targets."
        type: text

  S2-5:
    name: Targets related to managing material negative impacts, advancing positive impacts, and managing risks and opportunities
    description: "Time-bound, outcome-oriented targets set by the undertaking related to value chain workers."
    type: quantitative
    datapoints:
      - id: S2-5_01
        name: value_chain_workers_count
        question: "Estimated total number of workers in the upstream and downstream value chain."
        unit: count
        type: integer
      - id: S2-5_02
        name: value_chain_regions
        question: "Regions or countries with significant value chain worker presence, broken down by risk level."
        type: text
      - id: S2-5_03
        name: suppliers_screened_labor
        question: "Number of suppliers screened for labor practices and human rights."
        unit: count
        type: integer
      - id: S2-5_04
        name: suppliers_with_violations
        question: "Number of suppliers with identified labor violations in the reporting period."
        unit: count
        type: integer
      - id: S2-5_05
        name: severe_human_rights_incidents_vc
        question: "Number of severe human rights incidents identified in the value chain relating to value chain workers."
        unit: count
        type: integer
      - id: S2-5_06
        name: high_risk_suppliers
        question: "Percentage of suppliers located in high-risk countries for labor rights violations."
        unit: percentage
        type: float
      - id: S2-5_07
        name: supply_chain_mapping
        question: "Describe the level of supply chain mapping transparency (tier 1, tier 2, tier 3+ visibility)."
        type: text
      - id: S2-5_08
        name: living_wage_vc_assessment
        question: "Describe the assessment of living wage practices in the supply chain, including gaps identified."
        type: text
      - id: S2-5_09
        name: supplier_audit_conducted
        question: "Number of supplier audits conducted in the reporting period."
        unit: count
        type: integer
      - id: S2-5_10
        name: supplier_audit_pct
        question: "Percentage of suppliers audited for labor and human rights compliance."
        unit: percentage
        type: float
      - id: S2-5_11
        name: corrective_action_plans
        question: "Number of corrective action plans issued to suppliers for labor violations."
        unit: count
        type: integer
      - id: S2-5_12
        name: suppliers_trained_labor
        question: "Number of suppliers that received training on labor standards and human rights."
        unit: count
        type: integer
      - id: S2-5_13
        name: value_chain_worker_categories
        question: "Categories of value chain workers covered by the disclosure (e.g., seasonal, migrant, informal, contract workers)."
        type: text
      - id: S2-5_14
        name: child_labor_incidents
        question: "Number of child labor incidents identified in the value chain."
        unit: count
        type: integer
      - id: S2-5_15
        name: forced_labor_incidents
        question: "Number of forced labor incidents identified in the value chain."
        unit: count
        type: integer
      - id: S2-5_16
        name: health_safety_incidents_vc
        question: "Number of serious health and safety incidents involving value chain workers."
        unit: count
        type: integer

application_requirements:
  scope: "Upstream (tier 1 direct suppliers through tier N raw material producers) and downstream (distributors, logistics providers, wholesalers, retailers, franchise workers)"
  value_chain_boundary:
    upstream:
      - Tier 1: Direct suppliers (manufacturing, assembly, component suppliers)
      - Tier 2+: Raw material suppliers (commodities, minerals, agricultural inputs)
      - Subcontractors and home workers
      - Migrant and seasonal workers in supply chain
    downstream:
      - Logistics and distribution workers
      - Wholesale and retail workers
      - Franchise and licensee workers
      - Customer support and service workers
    excluded:
      - Own workforce (covered by ESRS S1)
      - Consumers and end-users (covered by ESRS S4)
  high_risk_factors:
    - Country risk: ILO indicators of forced labor and child labor prevalence, Corruption Perceptions Index, rule of law, freedom of association ratings
    - Sector risk: Agriculture (cocoa, coffee, cotton, palm oil), Textiles and apparel, Electronics, Mining and metals, Construction, Food and beverage, Toys, Footwear
    - Commodity risk: Cocoa (West Africa), Cotton (Uzbekistan, Turkmenistan), Cobalt (DRC), Gold (artisanal and small-scale mining), Mica (India), Seafood (fisheries with forced labor), Palm oil, Rubber
    - Business model risk: Use of labor brokers, subcontracting chains, seasonal/temporary workers, migrant workers, piece-rate systems
  due_diligence_framework:
    - OECD Due Diligence Guidance for Responsible Business Conduct
    - UN Guiding Principles Reporting Framework
    - IFC Performance Standards
    - SA8000 Standard
    - Ethical Trading Initiative (ETI) Base Code
  key_ilo_conventions:
    - C029: Forced Labour Convention
    - C105: Abolition of Forced Labour Convention
    - C138: Minimum Age Convention
    - C182: Worst Forms of Child Labour Convention
    - C087: Freedom of Association and Protection of the Right to Organise Convention
    - C098: Right to Organise and Collective Bargaining Convention
    - C100: Equal Remuneration Convention
    - C111: Discrimination (Employment and Occupation) Convention
    - C155: Occupational Safety and Health Convention
    - C190: Violence and Harassment Convention

references:
  - "UN Guiding Principles on Business and Human Rights (UNGPs)"
  - "OECD Due Diligence Guidance for Responsible Business Conduct"
  - "EU Corporate Sustainability Due Diligence Directive (CSDDD) 2024/1760"
  - "EU Forced Labour Regulation 2024/3015"
  - "ILO Forced Labour Convention No. 29 and Protocol of 2014"
  - "ILO Minimum Age Convention No. 138"
  - "ILO Worst Forms of Child Labour Convention No. 182"
  - "ILO Tripartite Declaration of Principles concerning Multinational Enterprises"
  - "UK Modern Slavery Act 2015"
  - "California Transparency in Supply Chains Act"
  - "German Supply Chain Due Diligence Act (LkSG)"
  - "French Duty of Vigilance Law (Loi de Vigilance)"
  - "Dutch Child Labour Due Diligence Law"
  - "Norwegian Transparency Act (Åpenhetsloven)"
  - "EU Conflict Minerals Regulation"
  - "UN Sustainable Development Goals (SDGs) – Goal 5 (Gender), Goal 8 (Decent Work), Goal 10 (Reduced Inequalities)"
  - "Social Accountability International SA8000"
  - "Ethical Trading Initiative (ETI) Base Code"
  - "Amfori BSCI Code of Conduct"
  - "Fair Labor Association (FLA) Workplace Code of Conduct"