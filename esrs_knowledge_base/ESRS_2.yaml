# ESRS 2 — General Disclosures (MANDATORY — always applies)
# ~60+ mandatory datapoints regardless of materiality
# Source: EFRAG IG3 Datapoint List

standard: "ESRS 2"
title: "General Disclosures"
category: "cross-cutting"
always_material: true
total_datapoints: 62

sections:
  - id: "BP-1"
    title: "General basis for preparation of sustainability statement"
    mandatory: true
    type: "narrative"
    description: "Basis on which the sustainability statement is prepared"
    datapoints:
      - name: "BP-1_01"
        description: "Whether the sustainability statement is prepared on a consolidated or individual basis"
        type: "boolean"
        mandatory: true
      - name: "BP-1_02"
        description: "Whether consolidated financial statements used as basis"
        type: "boolean"
      - name: "BP-1_03"
        description: "If using value chain estimates, the scope and basis of estimation"
        type: "narrative"

  - id: "BP-2"
    title: "Disclosures in relation to specific circumstances"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "BP-2_01"
        description: "Time horizons used (short-, medium-, long-term)"
        type: "narrative"
      - name: "BP-2_02"
        description: "Value chain estimation methodology"
        type: "narrative"
      - name: "BP-2_03"
        description: "Sources of estimation uncertainty"
        type: "narrative"
      - name: "BP-2_04"
        description: "Disclosures about changes in preparation or presentation"
        type: "narrative"
      - name: "BP-2_05"
        description: "Errors from prior periods and corrections"
        type: "narrative"
      - name: "BP-2_06"
        description: "Disclosures stemming from other legislation (e.g. SFDR)"
        type: "narrative"
      - name: "BP-2_07"
        description: "Incorporation by reference (where applicable)"
        type: "narrative"

  - id: "GOV-1"
    title: "Role of administrative, management and supervisory bodies"
    mandatory: true
    type: "narrative+table"
    datapoints:
      - name: "GOV-1_01"
        description: "Composition of administrative, management and supervisory bodies"
        type: "table"
      - name: "GOV-1_02"
        description: "Diversity (gender, age, background) of board members"
        type: "table"
      - name: "GOV-1_03"
        description: "Number of executive and non-executive members"
        type: "numeric"
      - name: "GOV-1_04"
        description: "Sustainability expertise within governing bodies"
        type: "narrative"
      - name: "GOV-1_05"
        description: "Representation of employees and other workers"
        type: "narrative"

  - id: "GOV-2"
    title: "Information provided to and sustainability matters addressed by undertakings' bodies"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "GOV-2_01"
        description: "How sustainability matters are reported to governing bodies"
        type: "narrative"
      - name: "GOV-2_02"
        description: "Frequency and process of sustainability reporting to board"
        type: "narrative"

  - id: "GOV-3"
    title: "Integration of sustainability-related performance in incentive schemes"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "GOV-3_01"
        description: "Whether sustainability metrics are included in remuneration policies"
        type: "boolean"
      - name: "GOV-3_02"
        description: "Characteristics of sustainability-related incentive schemes"
        type: "narrative"
      - name: "GOV-3_03"
        description: "Proportion of variable remuneration linked to sustainability"
        type: "numeric"

  - id: "GOV-4"
    title: "Statement on due diligence"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "GOV-4_01"
        description: "Due diligence statement covering human rights and environment"
        type: "narrative"
      - name: "GOV-4_02"
        description: "Mapping of due diligence process to UN Guiding Principles / OECD guidelines"
        type: "narrative"

  - id: "GOV-5"
    title: "Risk management and internal controls over sustainability reporting"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "GOV-5_01"
        description: "Description of risk management processes for sustainability reporting"
        type: "narrative"
      - name: "GOV-5_02"
        description: "Internal control framework for sustainability data"
        type: "narrative"
      - name: "GOV-5_03"
        description: "How risks are identified, assessed, and managed"
        type: "narrative"

  - id: "SBM-1"
    title: "Strategy, business model and value chain"
    mandatory: true
    type: "narrative+table"
    datapoints:
      - name: "SBM-1_01"
        description: "Description of strategy and business model"
        type: "narrative"
      - name: "SBM-1_02"
        description: "Key elements of the value chain (upstream, own ops, downstream)"
        type: "narrative"
      - name: "SBM-1_03"
        description: "Products and services offered"
        type: "narrative"
      - name: "SBM-1_04"
        description: "Markets served and customer segments"
        type: "narrative"
      - name: "SBM-1_05"
        description: "Number of employees by geography and sector"
        type: "numeric"
      - name: "SBM-1_06"
        description: "Total revenue by significant sector"
        type: "numeric"

  - id: "SBM-2"
    title: "Interests and views of stakeholders"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "SBM-2_01"
        description: "Key stakeholders identified"
        type: "narrative"
      - name: "SBM-2_02"
        description: "How stakeholder interests are understood and integrated into strategy"
        type: "narrative"

  - id: "SBM-3"
    title: "Material impacts, risks and opportunities (IROs)"
    mandatory: true
    type: "table"
    datapoints:
      - name: "SBM-3_01"
        description: "List of material IROs identified through double materiality"
        type: "table"
      - name: "SBM-3_02"
        description: "Interaction between IROs and strategy/business model"
        type: "narrative"
      - name: "SBM-3_03"
        description: "Resilience of strategy in relation to IROs"
        type: "narrative"

  - id: "IRO-1"
    title: "Description of process to identify and assess material IROs"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "IRO-1_01"
        description: "Process description for identifying material impacts and risks"
        type: "narrative"
      - name: "IRO-1_02"
        description: "Process description for identifying opportunities"
        type: "narrative"

  - id: "IRO-2"
    title: "Disclosure Requirements in ESRS covered by undertaking's sustainability statement"
    mandatory: true
    type: "table"
    datapoints:
      - name: "IRO-2_01"
        description: "List of ESRS requirements covered in the statement"
        type: "table"
      - name: "IRO-2_02"
        description: "Explanation for non-material ESRS standards (if applicable)"
        type: "narrative"

  - id: "MDR-P"
    title: "Policies adopted to manage material sustainability matters"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "MDR-P_01"
        description: "Description of key policies for each material sustainability matter"
        type: "narrative"
      - name: "MDR-P_02"
        description: "Scope of policies (value chain stages covered)"
        type: "narrative"
      - name: "MDR-P_03"
        description: "Accountability for policy implementation"
        type: "narrative"

  - id: "MDR-A"
    title: "Actions and resources related to material sustainability matters"
    mandatory: true
    type: "narrative"
    datapoints:
      - name: "MDR-A_01"
        description: "Key actions taken and planned for each material matter"
        type: "narrative"
      - name: "MDR-A_02"
        description: "Resources allocated (financial, human, technological)"
        type: "narrative"

  - id: "MDR-M"
    title: "Metrics related to material sustainability matters"
    mandatory: true
    type: "table"
    datapoints:
      - name: "MDR-M_01"
        description: "Metrics used to assess performance on material matters"
        type: "table"
      - name: "MDR-M_02"
        description: "Methodological notes for metric calculation"
        type: "narrative"

  - id: "MDR-T"
