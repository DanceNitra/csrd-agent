services:
  - type: web
    name: csrd-agent
    runtime: python
    repo: https://github.com/DanceNitra/csrd-agent
    branch: main
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CSRD_API_KEY
        generateValue: true